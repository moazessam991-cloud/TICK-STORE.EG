# Public customer checkout remains intentionally unauthenticated, with strict
# origin/schema limits and a durable service-only abuse gate in the function.
[functions.create-order]
enabled = true
verify_jwt = false
import_map = "./functions/create-order/deno.json"
entrypoint = "./functions/create-order/index.ts"

# Internal new-order email notification endpoint.
# Supabase JWT verification is intentionally disabled because this function
# authenticates server-to-server with TICK_NOTIFICATION_SECRET and accepts
# only an order_id; recipients/content are resolved from trusted server data.
[functions.send-order-notification]
enabled = true
verify_jwt = false
entrypoint = "./functions/send-order-notification/index.ts"

# Internal new-order push notification endpoint.
# Supabase JWT verification is intentionally disabled because this function
# authenticates server-to-server with TICK_PUSH_NOTIFICATION_SECRET and accepts
# only an order_id; Firebase credentials and push tokens stay server-side.
[functions.send-order-push]
enabled = true
verify_jwt = false
entrypoint = "./functions/send-order-push/index.ts"
